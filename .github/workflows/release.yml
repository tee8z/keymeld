name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare-release:
    name: Validate Release Source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      dry_run: ${{ steps.source.outputs.dry_run }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate committed versions and tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked | jq -er '
            . as $metadata |
            [.packages[] | select(.id as $id | $metadata.workspace_members | index($id)) | .version] |
            unique | if length == 1 then .[0] else error("Workspace package versions differ") end
          ')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test -s "docs/releases/$VERSION.md"
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          SOURCE_SHA=$(git rev-parse HEAD)
          DRY_RUN=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
            [[ "$(git rev-parse "$GITHUB_REF^{commit}")" == "$SOURCE_SHA" ]]
            DRY_RUN=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "sha=$SOURCE_SHA"
            echo "dry_run=$DRY_RUN"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Source commit: $SOURCE_SHA"
            echo "Workspace version: $VERSION"
            echo "Dry run: $DRY_RUN"
            echo "Prerelease: $PRERELEASE"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test Release Commit
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  authorization-e2e:
    name: Test Authorization End to End
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: false
          use-flakehub: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-authorization
      - name: Run real gateway and enclave authorization regressions
        run: nix develop -c bash examples/run-authorization-e2e.sh
      - name: Retain authorization failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-e2e-logs
          path: /tmp/keymeld-authorization-e2e.*/
          retention-days: 7

  build-release:
    name: Build Binaries (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --workspace --target "$TARGET"
      - name: Package binaries and source identity
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir release
          for BINARY in keymeld-gateway keymeld-enclave; do
            tar czf "release/$BINARY-$VERSION-$TARGET.tar.gz" -C "target/$TARGET/release" "$BINARY"
          done
          printf '%s\n' "$SOURCE_SHA" > "release/SOURCE-$TARGET.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  build-wasm-sdk:
    name: Build WASM SDK
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm
      - name: Verify WASM library compilation
        run: cargo build -p keymeld-sdk --target wasm32-unknown-unknown --release --features client --locked
        env:
          CFLAGS_wasm32_unknown_unknown: "-Wno-error=implicit-function-declaration"

  build-docker:
    name: Build Image (${{ matrix.image }}, ${{ matrix.arch }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, enclave]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: false
          use-flakehub: false
      - name: Build image archive without registry credentials
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          nix build ".#docker-$IMAGE" --print-build-logs --no-update-lock-file
          cp --dereference result "$RUNNER_TEMP/$IMAGE-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.image }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-images:
    name: Publish Image (${{ matrix.image }})
    needs: [prepare-release, test, authorization-e2e, build-release, build-wasm-sdk, build-docker]
    if: needs.prepare-release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [gateway, enclave]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-${{ matrix.image }}-*
          path: images
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish versioned image and manifest
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE_NAME"
          for ARCH in amd64 arm64; do
            docker load < "images/$IMAGE_NAME-$ARCH.tar.gz"
            docker tag "keymeld-$IMAGE_NAME:latest" "$IMAGE:$VERSION-$ARCH"
            docker push "$IMAGE:$VERSION-$ARCH"
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

  create-release:
    name: Publish GitHub Release
    needs: [prepare-release, test, authorization-e2e, build-release, build-wasm-sdk, build-docker, publish-images]
    if: needs.prepare-release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true
      - name: Record checksums
        working-directory: release
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Create release for the existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.sha }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          FLAGS=(--latest)
          if [[ "$PRERELEASE" == true ]]; then FLAGS=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --target "$SOURCE_SHA" --title "KeyMeld $RELEASE_TAG" \
            --notes-file "docs/releases/$VERSION.md" "${FLAGS[@]}"

  publish-latest:
    name: Update Latest Image (${{ matrix.image }})
    needs: [prepare-release, publish-images, create-release]
    if: needs.prepare-release.outputs.dry_run == 'false' && needs.prepare-release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: [gateway, enclave]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Point latest at the published version
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE_NAME"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
